name: Hostinator CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check Bash syntax
        run: bash -n bin/hostinator bin/site

      - name: Shellcheck
        run: shellcheck bin/hostinator bin/site

      - name: Format Rust
        run: cargo fmt --check

      - name: Check Rust
        run: cargo check --locked

      - name: Build webhook
        run: cargo build --locked --release
